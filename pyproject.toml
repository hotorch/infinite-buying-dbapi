[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infinite-buying-dbapi"
version = "0.1.0"
description = "Deterministic Pure Infinite Buying V4 engine with a safely gated DB Securities adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "exchange-calendars>=4.7,<5",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
app = "infinite_buying_dbapi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/infinite_buying_dbapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["infinite_buying_dbapi"]
branch = false
omit = [
  "*/cli.py",
  "*/config.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
